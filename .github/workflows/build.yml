name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stunslam-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build
        run: gradle build --no-daemon
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: stunslam-mod
          path: stunslam-mod/build/libs/stunslam-1.0.0.jar
